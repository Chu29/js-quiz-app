<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Quizito</title>
  </head>
  <body>
    <header class="start-quiz">Start Quiz</header>

    <!-- Questions section -->
    <section class="quiz-box">
      <h2 class="que-text">1. Hyper Text Markup Language</h2>
      <div class="options">
        <div class="option incorrect disabled">
          Hyper Text Multiple Language <i class="fa fa-times"></i>
        </div>
        <div class="option disabled">Hyper Tool Multi Language</div>
        <div class="option correct disabled">
          Hyper Text Markup Language <i class="fa fa-check"></i>
        </div>
        <div class="quiz-footer">
          <div class="footer-left">
            <span class="count-que">1</span> of
            <span class="total-que">5</span> Questions
          </div>
          <div class="footer-right">
            <div class="next-btn">Next Question</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Results section -->
    <section class="result-box">
      <h2>Result</h2>
      <div class="result">
        <h3 class="total-que">Total Questions : <span>5</span></h3>
        <h3 class="right-ans">Right Answers : <span>3</span></h3>
        <h3 class="wrong-ans">Wrong Answers : <span>2</span></h3>
        <h3 class="percentage">Percentage : <span>60.00%</span></h3>
      </div>
      <div class="result-footer">
        <div class="again-quiz">Again Quiz</div>
        <div class="exit">Exit</div>
      </div>
    </section>
    <script src="scripts/app.js"></script>
  </body>
</html>
